name: Backend CI

on:
  push:
    paths:
      - "backend/spring-boot/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/spring-boot/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn --batch-mode test
